# Defaults inherited by any pack whose config declares: inherits: [shared]
# threshold = pass_score = the stop bar (out of max_score, default 18). 15/18 ~= avg 5/6 per axis:
# "good enough", so a strict judge stops early instead of grinding to max_iters on every question.
# A perfect 18 is rare from a real judge -> leaving this at 18 makes the worst-case call count the
# NORMAL case. Raise per pack for stricter quality, lower for faster/cheaper. (See PROJECT_CONTEXT.)
threshold: 15
max_iters: 4
eval_retries: 1        # extra judge re-asks if its verdict can't be parsed (total tries = 1 + this)
max_data_retries: 1    # a BLANK retrieval (no rows / no SQL) may be a misread question, not a real gap:
                       # reformulate the question and re-query this many times before escalating the run
                       # for a human (never scored/passed). 0 = escalate immediately. Max 5.
                       # The rewrite must still ask YOUR question: a refusal or an off-subject drift is
                       # discarded and the run escalates (see engine/graph.py: _keeps_subject).
                       # Two escalation reasons reach the human: status="no_data" (the query ran and
                       # matched nothing -> check filters/freshness) and status="out_of_scope" (this
                       # data cannot answer that question -> ask a different agent). Neither is scored.
zero_is_no_data: false # OPT-IN: also treat a single all-zero/NULL row (COUNT(*)=0, SUM=NULL) as blank.
                       # OFF by default because a true zero is a legitimate answer and escalating it
                       # would be wrong. Turn on per pack where 0 nearly always means a filter or a
                       # status label matched nothing.
default_sql_tool: mock

# OPERATOR INSTRUCTIONS (optional, additive). Behavioral/policy directives the answer must follow,
# owned by the operator and composed like skills: shared/instructions/*.md + pack/instructions/*.md.
# The worker follows them; the judge penalizes violations. A pack with no instruction files gets no
# block (identical to before). Keys a pack may set:
#   exclude_shared_instructions: [<stem>]   # drop a shared instruction file, like exclude_shared_skills
#   allow_runtime_instructions: false       # accept a per-request `instructions` field (trust gate; off)

# OPTIONAL generic tool layer (additive; omit for legacy single-SQL packs).
# A pack may declare one or more named tools; the engine runs the READ-ONLY ones up front and
# feeds their observations into `generate`. SQL is just one tool type (see engine/tools/).
#   tools:
#     - type: mock            # registry key: mock | sql | http
#       name: catalog         # label shown in observations/logs (optional; defaults to type)
#       input: { query: "${task}" }    # per-tool input; ${task} is substituted at run time
#       params: { ... }       # adapter construction params (optional)
# A pack with NO `tools:` key keeps the identical legacy get_sql_tool().ask() path.
