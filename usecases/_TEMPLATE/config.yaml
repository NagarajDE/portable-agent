# _TEMPLATE — copy this whole folder to usecases/<your_pack>/ to start a new agent.
# See docs/concepts/use-case-pack-anatomy.md for what each file is + the new-pack checklist.
inherits: [shared]
name: "TEMPLATE agent (copy me)"
description: "One line describing what this agent does (shown to clients via the manifest)."
sample_task: "What is the total value across items?"

# LOOP vs NON-LOOP (default NON-LOOP). Omit/false -> the worker's answer is final: framing, retrieval
# (single SQL, deterministic sweep, agentic, planned multi-step), reformulation and the no-data escalation
# ALL still run; only the judge + refine are skipped and the answer is UNSCORED (score=None, status=ok).
# `loop: true` -> generate -> evaluate -> refine, scored against the rubric. If `loop: true` but no
# evaluator can be built (e.g. a model-required provider with no model), the run falls back to non-loop
# with a WARNING -- never a failed build.
loop: true

# OPTIONAL 'try these' questions a client/UI shows before the first question (GET /manifest on
# Snowflake, or the "__manifest__" request on Databricks). Omit this and they DEFAULT to your
# evals/golden_set.yaml questions, so they track what the pack is actually tested on.
# sample_questions:
#   - "What is the total value across items?"
#   - "Which item has the highest value?"

# This template is a single-SQL agent (no `tools:` key -> legacy SQL path). For a NON-SQL agent,
# declare tools: here and add  exclude_shared_skills: [sql_safety]  so SQL rules aren't injected.

# OPTIONAL provider/model DEFAULTS for this pack. Providers: mock | cortex | databricks | litellm
# (case-insensitive). Env WORKER_PROVIDER/WORKER_MODEL/EVAL_PROVIDER/EVAL_MODEL always WINS -- leave
# them unset for the pack to apply. Judge with a DIFFERENT model than the worker (self-grading blind spot).
# models:
#   worker:    { provider: cortex,     model: "claude-opus-5" }
#   evaluator: { provider: cortex,     model: "claude-opus-4-8" }   # used only when loop: true
#   planner:   { provider: cortex,     model: "claude-haiku-4-5" }  # tool_mode: planned only; unset = worker plans
#   # databricks needs an explicit serving-endpoint name (no default); litellm needs a "provider/model" string.

# OPTIONAL term->value binding (Cortex only; no-op on mock). Profiles the view's LOW-cardinality
# dimensions once and hands their REAL values to framing, so a user's word binds to the exact stored
# spelling on the first try. Recovery from a wrong value on ANY column is automatic regardless.
# value_catalog: { max_cardinality: 25 }

# OPTIONAL business glossary: put term -> meaning -> maps_to entries in glossary.yaml (see the example
# in this folder); shared/glossary.yaml entries are inherited, and a pack entry overrides a shared one.
