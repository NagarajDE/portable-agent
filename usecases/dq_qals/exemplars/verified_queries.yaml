- question: "Find duplicate inspection lots in QALS"
  sql: "SELECT PRUEFLOS, COUNT(*) AS N FROM QALS GROUP BY PRUEFLOS HAVING COUNT(*) > 1"
- question: "How many inspection lots are duplicated today?"
  sql: "SELECT COUNT(*) FROM (SELECT PRUEFLOS FROM QALS GROUP BY PRUEFLOS HAVING COUNT(*) > 1)"
