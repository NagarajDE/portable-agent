# Mirrors the native Snowflake agent DBADMIN.AGENTS.GOA_SPEND_ANALYTICS_AGENT (read-only reference).
# Semantic layer: declared in semantic_layer.yaml (this pack is AI+BI/Analyst-backed).
inherits: [shared]
name: "GOA indirect spend analytics"
sample_task: "What are the top 10 vendors by spend, and what % of total does each represent?"
# A lone all-zero/NULL row is a filter that matched nothing (SUM over no rows), never a real spend
# figure -- escalate it as no_data rather than scoring an "it's NULL" answer.
zero_is_no_data: true
# Use the pack skills to make the question precise BEFORE the Analyst call, so a "for the <name> category"
# question is bound to ExecutiveCategory instead of the wrong column. frame_skills scopes framing to the
# value->column map (see skills/dimension_map.md); the other skills stay for answer synthesis.
frame_query: true
frame_skills: [dimension_map.md]
# Reactive value recovery: if a query comes back EMPTY, look up the real ExecutiveCategory values and
# re-ask with the exact stored spelling (Cortex only; no-op on mock). Fires only on a blank result.
recover_value_dims: [ "BV_INDIRECTSPENDDETAIL.EXECUTIVECATEGORY" ]
