# ILLUSTRATIVE question -> SQL exemplars for the inventory pack (few-shot hints that shape the
# worker's mental model). NOTE: unlike a schema-"verified" set, these are NOT validated against the
# live INVENTORY_ANALYTICS columns — Cortex Analyst generates the real SQL from the semantic model.
# They show the SHAPE of a correct answer: current-state uses the most-recent snapshot and never
# sums across snapshots. Once you validate a query live, bless the real, schema-checked version here.
- question: "What is the current on-hand inventory value by plant?"
  sql: "SELECT Plant, SUM(CalculatedPlantStockValue) AS StockValue FROM INVENTORY_ANALYTICS WHERE MostRecentSnapshot = TRUE GROUP BY Plant ORDER BY StockValue DESC"
