inherits: [shared]
name: "KPI / metric analytics"
sample_task: "What was net revenue last month and how does it compare to the prior month?"
# Skill-informed query framing (opt-in, fail-safe); falls back to the raw question on any drift.
frame_query: true

# The evaluate->refine loop is OPT-IN (missing/false = the worker's answer is final, UNSCORED). This pack keeps
# scoring + refining (an evaluator is configured, or inherits the worker on mock).
loop: true
